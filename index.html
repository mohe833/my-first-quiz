<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Quiz von Mohammed Keyru</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💻 ICT Quiz</h1>

<div id="start-section">
    <h2>Willkommen!</h2>
    <p>Gib deinen Namen ein:</p>

    <input type="text" id="username" placeholder="Dein Name">

    <button onclick="startQuiz()">Start</button>
</div>

<div id="quiz-section" style="display:none;">

    <p id="progress"></p>

    <p id="category"></p>

    <img id="word-image" src="" alt="Bild">

    <h2 id="question"></h2>

    <input type="text" id="answer" placeholder="Antwort eingeben">

    <button id="confirm-btn" onclick="checkAnswer()">
        Bestätigen
    </button>

    <p id="feedback"></p>

    <p id="score"></p>

</div>

<script src="script.js.js"></script>

</body>
</html>
